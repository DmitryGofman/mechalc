<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cantilever — Design D: Instrument (after Halide)</title>
<style>
  /* ── After Halide (Apple Design Award 2020) ──
     A pro camera for stress: near-black chrome, a viewfinder with grid
     and focus peaking on the hot fibers, a live stress histogram, and
     scrub-wheel dials you drag like an exposure wheel. */
  :root {
    --bg: #000; --chrome: #0d0d0f; --line: #222226; --line2: #2e2e33;
    --ink: #f2f2f4; --dim: #8a8a93; --faint: #4c4c55;
    --amber: #ffb800; --green: #3fd68f; --red: #ff4d42;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         user-select: none; -webkit-user-select: none; }
  .shell { max-width: 560px; margin: 0 auto; padding: 18px 14px 50px; }
  a.back { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--faint); text-decoration: none; }
  a.back:hover { color: var(--amber); }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin: 12px 2px 10px; }
  .topbar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .mode { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden;
          font-family: var(--mono); font-size: 10px; letter-spacing: .12em; }
  .mode button { background: none; border: none; color: var(--dim); padding: 6px 12px; cursor: pointer;
                 font: inherit; letter-spacing: inherit; }
  .mode button.on { background: var(--amber); color: #000; font-weight: 700; }

  /* viewfinder */
  .vf { position: relative; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden;
        background: #050506; }
  .vf svg { width: 100%; height: 240px; display: block; }
  .vf .hud { position: absolute; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
             color: var(--amber); text-shadow: 0 0 6px rgba(0,0,0,.9); }
  .hud.tl { top: 8px; left: 10px; } .hud.tr { top: 8px; right: 10px; text-align: right; }
  .hud.bl { bottom: 8px; left: 10px; color: var(--dim); } .hud.br { bottom: 8px; right: 10px; }
  .hud .big { font-size: 15px; font-weight: 700; }

  /* histogram of σ(x) along the span */
  .histo { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px;
           background: var(--chrome); }
  .histo .h-lab { display: flex; justify-content: space-between; font-family: var(--mono);
                  font-size: 9.5px; letter-spacing: .16em; color: var(--faint); margin-bottom: 6px; }
  .histo svg { width: 100%; height: 56px; display: block; }

  /* readout strip */
  .strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .cell { background: var(--chrome); padding: 10px 10px 8px; }
  .cell .c-lab { font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; color: var(--faint); }
  .cell .c-val { font-family: var(--mono); font-size: 16px; font-weight: 700; margin-top: 4px;
                 font-variant-numeric: tabular-nums; color: var(--ink); }
  .cell .c-unit { font-family: var(--mono); font-size: 8.5px; color: var(--dim); }
  .cell.hot .c-val { color: var(--amber); }

  /* dial deck — drag horizontally to scrub */
  .deck { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .dial { border: 1px solid var(--line); border-radius: 10px; background: var(--chrome);
          padding: 8px 12px 4px; cursor: ew-resize; touch-action: pan-y; }
  .dial.active { border-color: var(--amber); }
  .dial-top { display: flex; justify-content: space-between; align-items: baseline; }
  .dial-top .d-lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--dim); }
  .dial-top .d-val { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--amber);
                     font-variant-numeric: tabular-nums; }
  .ticks { height: 26px; overflow: hidden; position: relative; margin-top: 2px; }
  .ticks svg { position: absolute; top: 0; height: 26px; }
  .ticks::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
                  background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dial .d-hint { text-align: center; font-family: var(--mono); font-size: 8px; letter-spacing: .2em;
                  color: var(--faint); padding: 3px 0 2px; }

  select { width: 100%; margin-top: 8px; background: var(--chrome); color: var(--ink);
           border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
           font: 12px var(--mono); letter-spacing: .05em; }
  .credit { margin-top: 26px; text-align: center; color: var(--faint); font-size: 11px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">‹ ALL DESIGNS</a>

  <div class="topbar">
    <h1>CANTILEVER · σ-METER</h1>
    <div class="mode">
      <button id="modeM" class="on">MANUAL δ</button>
      <button id="modeA">AUTO SF2</button>
    </div>
  </div>

  <div class="vf">
    <svg id="vf" viewBox="0 0 540 240" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="grid" width="54" height="48" patternUnits="userSpaceOnUse">
          <path d="M54 0H0V48" fill="none" stroke="#17171a" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="540" height="240" fill="url(#grid)"/>
      <rect x="30" y="30" width="16" height="180" fill="#1c1c20" stroke="#2e2e33"/>
      <path id="rest" d="M46 110 H 500" stroke="#2a2a30" stroke-width="1.5" stroke-dasharray="2 6" fill="none"/>
      <g id="beamG"></g>
      <path id="peaking" d="" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="3 3" opacity="0"/>
    </svg>
    <div class="hud tl">σ-PK <span class="big" id="hudS">—</span> MPa</div>
    <div class="hud tr">SF <span class="big" id="hudSF">—</span></div>
    <div class="hud bl" id="hudMat">—</div>
    <div class="hud br" id="hudPeak">PEAKING OFF</div>
  </div>

  <div class="histo">
    <div class="h-lab"><span>σ(x) ALONG SPAN — WALL → TIP</span><span id="histoMax">0 … σ-PK</span></div>
    <svg id="histo" viewBox="0 0 520 56" preserveAspectRatio="none"></svg>
  </div>

  <div class="strip">
    <div class="cell"><div class="c-lab">STIFFNESS</div><div class="c-val" id="kOut">—</div><div class="c-unit">N/mm</div></div>
    <div class="cell"><div class="c-lab">TIP FORCE</div><div class="c-val" id="FOut">—</div><div class="c-unit">N</div></div>
    <div class="cell hot"><div class="c-lab">δ TIP</div><div class="c-val" id="dOut">—</div><div class="c-unit">mm</div></div>
    <div class="cell"><div class="c-lab">INERTIA I</div><div class="c-val" id="IOut">—</div><div class="c-unit">mm⁴</div></div>
  </div>

  <div class="deck" id="deck"></div>
  <select id="mat"></select>

  <div class="credit">DESIGN STUDY D · AFTER HALIDE — APPLE DESIGN AWARD 2020</div>
</div>

<script>
"use strict";
const MATS = {
  "Spring Steel (1095)":  { E: 205,  sy: 1200 },
  "Ti-6Al-4V":            { E: 114,  sy: 880  },
  "Aluminum 6061-T6":     { E: 68.9, sy: 276  },
  "Aluminum 7075-T6":     { E: 71.7, sy: 503  },
  "Delrin (POM)":         { E: 3.1,  sy: 70   },
  "PLA (FDM)":            { E: 3.5,  sy: 50   },
  "PETG (FDM)":           { E: 2.0,  sy: 45   },
  "Polycarbonate (FDM)":  { E: 2.2,  sy: 57   },
  "PA12 (MJF)":           { E: 1.7,  sy: 48   },
};
const $ = id => document.getElementById(id);
const fmt = (v,d=2) => Number(v).toLocaleString("en-US",{maximumFractionDigits:d});

const matSel = $("mat");
for (const n of Object.keys(MATS)) { const o = document.createElement("option"); o.value = o.textContent = n; matSel.appendChild(o); }
matSel.value = "Aluminum 7075-T6";

// Scrub dials: {key, label, unit, min, max, step, value, perPx}
const DIALS = [
  { key:"L", label:"LENGTH L",     unit:"mm", min:5,   max:300, step:1,   value:60, perPx:.6 },
  { key:"t", label:"THICKNESS t",  unit:"mm", min:0.2, max:12,  step:0.1, value:2,  perPx:.02 },
  { key:"w", label:"WIDTH w",      unit:"mm", min:1,   max:60,  step:0.5, value:10, perPx:.12 },
  { key:"d", label:"DEFLECTION δ", unit:"mm", min:0,   max:30,  step:0.1, value:3,  perPx:.06 },
];
let autoMode = false;

function buildDials() {
  const deck = $("deck");
  for (const d of DIALS) {
    const el = document.createElement("div");
    el.className = "dial"; el.id = "dial-" + d.key;
    el.innerHTML = `
      <div class="dial-top"><span class="d-lab">${d.label}</span>
        <span class="d-val"><span id="val-${d.key}">—</span> <span style="color:var(--faint);font-size:10px">${d.unit}</span></span></div>
      <div class="ticks"><svg id="ticks-${d.key}" viewBox="0 0 2000 26" width="2000"></svg></div>
      <div class="d-hint">◂ DRAG TO SCRUB ▸</div>`;
    deck.appendChild(el);
    const tsvg = el.querySelector(`#ticks-${d.key}`);
    let marks = "";
    for (let x = 0; x <= 2000; x += 12) {
      const major = (x/12) % 5 === 0;
      marks += `<line x1="${x}" y1="${major?4:10}" x2="${x}" y2="26" stroke="${major?"#4c4c55":"#2a2a30"}" stroke-width="1.5"/>`;
    }
    tsvg.innerHTML = marks;

    let sx = 0, sv = 0, drag = false;
    el.addEventListener("pointerdown", ev => {
      if (autoMode && d.key === "d") return;      // δ is driven in AUTO
      drag = true; sx = ev.clientX; sv = d.value;
      el.classList.add("active"); el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", ev => {
      if (!drag) return;
      let v = sv + (ev.clientX - sx) * d.perPx;
      v = Math.round(v / d.step) * d.step;
      d.value = Math.min(d.max, Math.max(d.min, v));
      update();
    });
    const end = () => { drag = false; el.classList.remove("active"); };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }
}

const val = key => DIALS.find(d => d.key === key).value;

function update() {
  const m = MATS[matSel.value];
  const L = val("L"), t = val("t"), w = val("w");
  const E = m.E*1000, I = w*t*t*t/12;
  const k = 3*E*I/(L*L*L);

  const dDial = DIALS.find(d => d.key === "d");
  if (autoMode) {
    // AUTO SF2: solve δ so that σ = σy/2  →  δ = σy·L² / (3·E·t)
    dDial.value = Math.min(dDial.max, (m.sy/2) * L*L / (3*E*t));
  }
  const d = dDial.value;
  const F = k*d, sig = 3*E*t*d/(2*L*L);
  const sf = sig > 0 ? m.sy/sig : Infinity, util = sig/m.sy;

  for (const dl of DIALS) {
    $("val-"+dl.key).textContent = fmt(dl.value, dl.step < 1 ? 1 : 0);
    const t2 = $("ticks-"+dl.key);
    const frac = (dl.value - dl.min) / (dl.max - dl.min);
    t2.style.left = `calc(50% - ${(frac*1700+150).toFixed(0)}px)`;
  }
  $("hudS").textContent = fmt(sig,1);
  $("hudSF").textContent = isFinite(sf) ? fmt(sf,2) : "∞";
  $("hudSF").parentElement.style.color = sf < 1 ? "var(--red)" : sf < 2 ? "var(--amber)" : "var(--green)";
  $("hudMat").textContent = `${matSel.value.toUpperCase()} · E ${m.E} GPa · σY ${m.sy} MPa`;
  $("kOut").textContent = fmt(k, k<10?2:1);
  $("FOut").textContent = fmt(F, F<10?2:1);
  $("dOut").textContent = fmt(d,1);
  $("IOut").textContent = fmt(I, I<10?2:0);

  // viewfinder beam: stack of segments colored by local σ(x)
  const x0 = 46, x1 = 500, y0 = 110;
  const amp = Math.max(-70, Math.min(70, d/Math.max(L*0.12,1)*70));
  const N = 40; let segs = "";
  const beamW = Math.max(4, Math.min(18, t*3));
  let prevX = x0, prevY = y0;
  for (let i = 1; i <= N; i++) {
    const p = i/N, x = x0 + (x1-x0)*p;
    const y = y0 + amp*(1.5*p*p - .5*p*p*p);
    const localU = util * (1 - (i-.5)/N);   // σ(x) tapers linearly to 0 at tip
    const c = localU >= 1 ? "#ff4d42" : localU >= .75 ? "#ffb800" : localU >= .4 ? "#8a7a30" : "#3d4a42";
    segs += `<line x1="${prevX.toFixed(1)}" y1="${prevY.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
             stroke="${c}" stroke-width="${beamW}" stroke-linecap="round"/>`;
    prevX = x; prevY = y;
  }
  $("beamG").innerHTML = segs;

  // focus peaking: dashed red outline on the over-yield stretch near the wall
  const overFrac = util > 1 ? 1 - 1/util : 0;   // portion of span with σ(x) > σy
  const pk = $("peaking");
  if (overFrac > 0) {
    let path = "";
    for (let i = 0; i <= 20; i++) {
      const p = (i/20) * overFrac, x = x0 + (x1-x0)*p;
      const y = y0 + amp*(1.5*p*p - .5*p*p*p) - beamW/2 - 4;
      path += (i ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
    }
    pk.setAttribute("d", path); pk.setAttribute("opacity", "1");
    $("hudPeak").textContent = "⚠ PEAKING: σ>σY"; $("hudPeak").style.color = "var(--red)";
  } else {
    pk.setAttribute("opacity", "0");
    $("hudPeak").textContent = "PEAKING OFF"; $("hudPeak").style.color = "var(--faint)";
  }

  // histogram σ(x) — bars from wall to tip
  const H = $("histo"); let bars = "";
  const nb = 52;
  for (let i = 0; i < nb; i++) {
    const u = util * (1 - i/nb);
    const h = Math.min(1, u) * 50;
    const c = u >= 1 ? "var(--red)" : u >= .5 ? "var(--amber)" : "#3fd68f";
    bars += `<rect x="${i*10}" y="${56-h}" width="7" height="${Math.max(1,h)}" fill="${c}" opacity="${u>=1?1:.85}"/>`;
  }
  if (util > 1) bars += `<line x1="0" y1="6" x2="520" y2="6" stroke="var(--red)" stroke-dasharray="4 4" stroke-width="1"/>`;
  H.innerHTML = bars;
  $("histoMax").textContent = `σY = ${m.sy} MPa ${util>1?"· CLIPPED":""}`;
}

$("modeM").addEventListener("click", () => { autoMode = false; $("modeM").classList.add("on"); $("modeA").classList.remove("on"); update(); });
$("modeA").addEventListener("click", () => { autoMode = true; $("modeA").classList.add("on"); $("modeM").classList.remove("on"); update(); });
matSel.addEventListener("change", update);
buildDials();
update();
</script>
</body>
</html>
