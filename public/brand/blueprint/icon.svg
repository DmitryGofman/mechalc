<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Design A "Blueprint" — a bolt cross-section drawn to convention:
       solid body circle, 3/4 thread arc, dash-dot centerlines, drawing grid. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d131a"/>
      <stop offset="1" stop-color="#080c10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- drawing grid -->
  <g stroke="#111a23" stroke-width="2">
    <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
    <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
  </g>

  <!-- dash-dot centerlines -->
  <g stroke="#3a78c2" stroke-width="4" opacity="0.6" stroke-dasharray="34 12 6 12">
    <path d="M256 30V482"/>
    <path d="M30 256H482"/>
  </g>

  <!-- thread major diameter: thin 3/4 arc, broken in the upper-right quadrant -->
  <path d="M405.7 229.6 A152 152 0 1 1 282.4 106.3"
        fill="none" stroke="#5a95d8" stroke-width="8" stroke-linecap="round"/>

  <!-- body circle -->
  <circle cx="256" cy="256" r="112" fill="#0c141c" stroke="#e8edf1" stroke-width="16"/>

  <!-- callout -->
  <text x="452" y="462" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace"
        font-size="30" letter-spacing="2" fill="#46515c">M12</text>
</svg>
